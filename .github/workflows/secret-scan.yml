name: secret-scan

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

# A new push to the same ref supersedes any in-flight scan of an earlier
# commit on it -- gitleaks is a required check, but re-scanning a superseded
# commit wastes runner time and its verdict is stale before it lands anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: gitleaks detect
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
