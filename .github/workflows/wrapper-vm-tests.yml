# wrapper-vm-tests
#
# Opt-in CI job for the multi-edition install integration test (Sprint 5c,
# WBS 2.24, Task 13). The job is currently DISABLED via `if: false` because
# the underlying flow has two prerequisites that are not yet wired:
#
#   1. The AOT-published `SigilBuild.Wrapper.exe` must be staged under
#      `runtimes/win-x64/` next to the test assembly so
#      `WrapperRuntimeLocator.Locate()` succeeds. See
#      `src/SigilBuild.Packaging/ExeWrapper/WrapperRuntimeLocator.cs`.
#   2. (Future) A real Windows Sandbox `.wsb` profile, if/when we harden the
#      `VmSandbox` helper from a host-process runner to true OS isolation.
#
# To enable: flip `if: false` to `if: true`, add the publish-and-copy step
# below the placeholder, and remove this banner.
name: wrapper-vm-tests

# Opt-in: only runs on demand. Until the AOT runtime publish + Windows
# Sandbox config land, this job is a no-op shell intentionally.
on:
  workflow_dispatch:
  # push: ... (intentionally NOT enabled on push — opt-in until the AOT
  # publish-and-copy step is wired into the build pipeline)

permissions:
  contents: read

jobs:
  wrapper-vm-tests:
    runs-on: windows-latest
    if: false  # disabled by default; flip to true once AOT publish lands
    env:
      SIGIL_VM_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish + stage installer host AOT runtime
        shell: pwsh
        run: |
          # T3: WrapperRuntimeLocator now resolves
          # runtimes/<rid>/SigilBuild.Installer.Host.exe. Stage the Native AOT host
          # into the integration-test output so Locate(arch) succeeds.
          $dest = "tests/SigilBuild.Wrapper.IntegrationTests/bin/Release/net10.0"
          ./scripts/publish-installer-runtime.ps1 -Rids win-x64 -Configuration Release -DestinationRoot $dest

      - name: Run integration tests
        run: dotnet test tests/SigilBuild.Wrapper.IntegrationTests/SigilBuild.Wrapper.IntegrationTests.csproj --logger "trx;LogFileName=wrapper-vm-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-vm-test-results
          path: '**/TestResults/**/*.trx'

      # T12 — dual install scope (user | machine) end-to-end. Runs the stamped
      # Setup.exe /silent in BOTH scopes and asserts the scope-correct surfaces:
      #   * /currentuser → HKCU ARP, %LocalAppData%\Programs root, user PATH,
      #     per-user shortcuts, %LocalAppData% journal — and ZERO HKLM writes,
      #     completing WITHOUT a UAC prompt (asInvoker manifest).
      #   * /allusers   → HKLM ARP, %ProgramFiles% root, machine PATH, common
      #     (all-users) shortcuts, %ProgramData% journal — self-elevates via the
      #     ShellExecuteExW `runas` relaunch (the VM job runs elevated so the
      #     child inherits the token). Uninstall must run in the SAME scope it was
      #     installed with (the ARP UninstallString carries the scope flag).
      # This is the real-elevation assertion the unit tests defer to the VM.
      - name: T12 both-scopes install/uninstall matrix
        shell: pwsh
        env:
          SIGIL_VM_SCOPE_MATRIX: "1"
        run: |
          foreach ($scope in @('currentuser', 'allusers')) {
            Write-Host "== scope: /$scope =="
            dotnet test tests/SigilBuild.Wrapper.IntegrationTests/SigilBuild.Wrapper.IntegrationTests.csproj `
              --filter "Category=Scope" `
              --logger "trx;LogFileName=wrapper-vm-tests-$scope.trx" `
              -- SigilVmTests.Scope=$scope
          }

      # T15 — uninstall survivability: uninstall must still work after the user
      # deletes the downloaded setup exe. Install writes {install_dir}\uninstall.exe
      # (a journaled final step) and points ARP's UninstallString at THAT copy with
      # the scope flag (never at the download's Environment.ProcessPath). This job
      # step asserts the survivability contract end-to-end in the VM:
      #   1. Pack a fixture Setup.exe, run it /silent (per-user scope).
      #   2. Assert {install_dir}\uninstall.exe exists and the ARP UninstallString
      #      references it (contains "uninstall.exe" + "/S /Uninstall"), NOT the
      #      original setup exe path.
      #   3. DELETE the original downloaded Setup.exe.
      #   4. Invoke the ARP UninstallString (the copied uninstall.exe /S /Uninstall
      #      /currentuser) and assert it reverses everything — files, registry, PATH,
      #      shortcuts — and that uninstall.exe is gone OR scheduled for reboot
      #      deletion (MoveFileEx MOVEFILE_DELAY_UNTIL_REBOOT), since a running image
      #      cannot delete itself in place.
      #   5. Double-clicking uninstall.exe with NO /S self-detects uninstall mode
      #      (filename == uninstall.exe) and shows the interactive confirm flow; the
      #      headed smoke covers that path.
      # This is the deleted-original assertion the unit tests (InstallSurvivability /
      # SelfDelete) cannot make without real elevation + a real reboot; it defers to
      # the VM here.
      - name: T15 deleted-original uninstall survivability
        shell: pwsh
        env:
          SIGIL_VM_UNINSTALL_SURVIVE: "1"
        run: |
          dotnet test tests/SigilBuild.Wrapper.IntegrationTests/SigilBuild.Wrapper.IntegrationTests.csproj `
            --filter "Category=UninstallSurvivability" `
            --logger "trx;LogFileName=wrapper-vm-tests-uninstall-survive.trx"
