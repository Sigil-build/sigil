# wrapper-vm-tests
#
# End-to-end install/uninstall verification for the stamped Setup.exe, run on a
# real Windows runner (the "VM"). It never runs on a PR (real installs mutate the
# runner) but it does run on merge and weekly - see the `on:` block; the real VM
# verdict is CI's, not a dev box's.
#
# What this workflow ACTUALLY exercises — one line per scenario that has a test
# reading its toggle. Register row R64: this header used to advertise a
# currentuser × allusers scope matrix and five more scenarios that no test read,
# which made the "VM matrix green" gate checkbox vacuous for every one of them.
# Nothing is listed here that is not wired:
#
#   pack → /silent install → verify payload/ARP → uninstall → verify reversed
#                                                  (T5/T12, MultiEdition + WixClass)
#   registered ARP UninstallString runs from inside install_dir (T15/R58)
#   version-aware upgrade / blocked downgrade / /force-downgrade (P3, gap G3)
#   prerequisite detect → install → 3010 / skip / abort         (P5, gap G6)
#   localization: /silent outcome is invariant under /lang, manifest pin wins (P9)
#
# Still UNCOVERED, and deliberately no longer advertised (R64 stays open for
# them): the per-machine (/allusers) half of every leg above, double-install
# idempotency, real manifest.App.* ARP value assertions, and the P6 files-in-use
# /closeapps + setup-mutex legs.
#
# The publish-runtime step ALWAYS runs before any pack: the packager stamps the
# AOT installer host, so it must be staged next to the integration-test assembly
# (runtimes/win-x64/) before `Sigil.PackAsync` is invoked inside a test.
name: wrapper-vm-tests

# Real installs mutate the runner's registry/PATH, so this never runs on a PR — but
# gate G3 (docs/plan/release/03-RC_ORCHESTRATION.md) requires the matrix to run "on a
# schedule or on merge, not only on demand": a dispatch-only workflow is one nobody
# dispatches, which is exactly how the fixtures in this suite rotted unnoticed until
# its first real run (register row R66).
#
# G3 is met by `push`, which is the half that covers the release branch. Read the two
# triggers separately, because GitHub does not treat them alike:
#
#   push      — fires on merge into `main` AND into any `release/**` branch. This is
#               what gives the RC a verdict: every merge into `release/v0.1.0-alpha`
#               runs the matrix against that branch's own tree.
#   schedule  — GitHub runs `schedule` from the **default branch only**, and only
#               using the workflow file as it exists on that branch. So this cron
#               gives `main` a weekly floor once this file reaches `main`, and does
#               NOT run on `release/**` at all. A release branch that sits quiet
#               between merges therefore gets no scheduled verdict; its coverage
#               comes from the `push` trigger above, plus manual dispatch.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - 'release/**'
    # Unlike ci.yml/secret-scan.yml/pr-guards.yml, this workflow produces NO
    # required status check (see the header comment above — it never runs on
    # a PR at all), so a workflow-level path filter here cannot wedge a PR
    # the way it would on those. Skip the real-install matrix outright on a
    # docs-only push -- same docs-only set as ci.yml's `changes` job.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    # Mondays 03:00 UTC. Default branch only — see the note above.
    - cron: '0 3 * * 1'

permissions:
  contents: read

# Back-to-back RC merges must not pile up real-install jobs on top of each other:
# supersede the in-flight run for the same ref. Keyed by ref so main and a release
# branch never cancel one another, and by event_name so the weekly cron on main and
# a push to main are separate groups rather than killing each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-vm-tests:
    runs-on: windows-latest
    name: vm (install matrix)
    env:
      # Opt the soft-skip integration tests into their real end-to-end body.
      SIGIL_VM_TESTS: "1"
      # Scenario toggles. Only toggles a test actually READS may live here —
      # register row R64: this block used to declare ten, of which five were read by
      # nothing at all, so the workflow advertised legs that did not exist and
      # flipping them changed nothing about what ran. Removed rather than faked:
      # SIGIL_VM_SCOPE / SIGIL_VM_SCOPE_MATRIX (with the two-leg currentuser ×
      # allusers matrix they parameterized — no test read the scope, so both legs
      # ran the identical per-user suite twice), SIGIL_VM_ARP_VALUES,
      # SIGIL_VM_DOUBLE_INSTALL and SIGIL_VM_CLOSEAPPS. Each comes back the day a
      # test reads it; until then an honest smaller matrix beats an advertised one.
      # (R64 stays OPEN for those five scenarios themselves — they are real gaps in
      # coverage, now visible as gaps instead of hidden behind a live env var.)
      SIGIL_VM_UNINSTALL_SURVIVE: "1"  # T15/R58 ArpUninstallStringTests: the registered UninstallString runs from inside install_dir
      SIGIL_VM_UPGRADE: "1"            # P3 UpgradeInstallTests: v1→v2 upgrade (prior dir preserved), v2→v1 blocked (exit 3), /force-downgrade
      SIGIL_VM_PREREQ: "1"             # P5 PrerequisiteInstallTests: detect→install→3010 (exit 3010), skip-when-present, abort on bad exit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Build first so the publish step can stage the runtime INTO the test's
      # output directory (AppContext.BaseDirectory) that WrapperRuntimeLocator reads.
      - name: build integration test project
        run: >
          dotnet build tests/SigilBuild.Wrapper.IntegrationTests/SigilBuild.Wrapper.IntegrationTests.csproj
          --configuration Release

      # MUST run before any pack: stage the Native-AOT installer host (+ its
      # SIGIL_RUNTIME_V1 native deps) so ExeWrapperPackager can stamp a Setup.exe.
      # windows-latest carries the "Desktop development with C++" workload the AOT
      # link needs; the SAME script drives local pack, so CI and `sigil pack` stamp
      # byte-identical runtimes (spec T3/T18).
      - name: publish + stage installer host AOT runtime (before packing)
        shell: pwsh
        run: |
          $dest = "tests/SigilBuild.Wrapper.IntegrationTests/bin/Release/net10.0"
          ./scripts/publish-installer-runtime.ps1 `
            -Rids win-x64 `
            -Configuration Release `
            -DestinationRoot $dest `
            -SizeGateMb 45

      # HARD GATE (T1.4/R22 — same shape as the p11 job's guard below): a dropped
      # SIGIL_VM_TESTS or a silently empty runtime staging would make this whole
      # job go green having exercised nothing, because TestEnvironment.IsEnabled
      # soft-skips (not hard-fails) when either precondition is absent. Fail the
      # job here instead so a green install-matrix run is proof the legs actually ran.
      - name: require SIGIL_VM_TESTS and a staged runtime (else this job would silently soft-skip)
        shell: pwsh
        run: |
          if ($env:SIGIL_VM_TESTS -ne '1') { Write-Error "wrapper-vm-tests install matrix requires SIGIL_VM_TESTS=1; refusing to pass vacuously"; exit 1 }
          $exe = "tests/SigilBuild.Wrapper.IntegrationTests/bin/Release/net10.0/runtimes/win-x64/SigilBuild.Installer.Host.exe"
          if (-not (Test-Path $exe)) { Write-Error "staged win-x64 installer host runtime missing at $exe; the VM-gated install/uninstall tests would silently soft-skip having exercised nothing; refusing to pass vacuously"; exit 1 }
          Write-Host "SIGIL_VM_TESTS=1 and staged runtime confirmed present"

      # The integration tests pack a fixture Setup.exe, run it /silent, and assert the
      # resulting filesystem/registry/PATH/shortcut surfaces end-to-end (per-user
      # scope throughout — see the SIGIL_VM_SCOPE note in this job's env block).
      - name: run install/uninstall matrix
        shell: pwsh
        run: |
          dotnet test tests/SigilBuild.Wrapper.IntegrationTests/SigilBuild.Wrapper.IntegrationTests.csproj `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=wrapper-vm-tests-install-matrix.trx"

      - name: upload test results (install matrix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-vm-test-results-install-matrix
          path: '**/TestResults/**/*.trx'
          if-no-files-found: warn

  # P12 (T12.6): update-engine + web-installer stub end-to-end, appended as its
  # OWN job per the append-only convention (docs/plan/ORCHESTRATION_PLAN.md:
  # "each task appends its own job/step ... append-only, never reorder others'
  # steps") — kept separate from the install-matrix job above rather than adding a
  # step to it. T12.6 itself already delivers everything locally runnable
  # (SigilBuild.Wrapper.Tests/Update/UpdateEndToEndTests.cs and
  # SigilBuild.Packaging.Tests/ExeWrapper/WebInstallerStubEndToEndTests.cs — real
  # local HTTPS server, real ECDSA P-256 signature verify, real sha256-checked
  # download, real checksum-rejection rollback) via a recorded-launch double for
  # the child process. This job additionally stages the Native-AOT installer
  # host runtime so ExeWrapperWebInstallerPackTests / ExeWrapperWebInstallerBlobTests
  # (SigilBuild.Packaging.Tests) run their REAL pack path instead of soft-skipping
  # (no staged runtime locally) — producing a genuine packed `--payload web` stub +
  # full package and asserting their construction end-to-end on a real Windows host.
  # NOT locally runnable — this job only executes on windows-latest.
  # Still missing (left for P13 / T13.1's full-matrix consolidation): a true
  # cross-process leg where a packed web-installer stub downloads a packed full
  # Setup.exe over real HTTP and the full Setup.exe actually runs and registers
  # its own ARP/uninstall state — see T12.6's report for the exact scope drawn.
  p12-update-webinstaller-vm:
    runs-on: windows-latest
    name: vm (p12 update + web-installer)
    env:
      # T1.4/R22: previously this job had no VM-mode marker at all, so nothing
      # would notice if it were silently invoked without real VM intent. Set
      # here and asserted by the guard step below, matching the install-matrix
      # and p11 jobs' convention.
      SIGIL_VM_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # R68: this was ONE `dotnet build` with TWO csproj paths, which MSBuild rejects
      # outright — `MSBUILD : error MSB1008: Only one project can be specified` — so
      # this job died at its first build step on the matrix's first real run, before
      # staging a runtime or running a test. `dotnet build` takes at most one
      # project/solution, so each project gets its own invocation. Order matters only
      # in that both must be built before the two test steps below run --no-build.
      - name: build P12 update-engine test project
        run: >
          dotnet build tests/SigilBuild.Wrapper.Tests/SigilBuild.Wrapper.Tests.csproj
          --configuration Release

      - name: build P12 web-installer test project
        run: >
          dotnet build tests/SigilBuild.Packaging.Tests/SigilBuild.Packaging.Tests.csproj
          --configuration Release

      # Stage the AOT installer host runtime next to SigilBuild.Packaging.Tests'
      # output so ExeWrapperWebInstallerPackTests' PackAsync(--payload web) tests
      # exercise the real pack pipeline (see LocateStagedRuntime in that file)
      # instead of soft-skipping, mirroring the main job's publish-before-pack step.
      - name: publish + stage installer host AOT runtime (before packing)
        shell: pwsh
        run: |
          $dest = "tests/SigilBuild.Packaging.Tests/bin/Release/net10.0"
          ./scripts/publish-installer-runtime.ps1 `
            -Rids win-x64 `
            -Configuration Release `
            -DestinationRoot $dest `
            -SizeGateMb 45

      # HARD GATE (T1.4/R22 — same shape as the p11 job's guard below): without
      # this, a dropped SIGIL_VM_TESTS or a silently empty runtime staging would
      # make this job go green having exercised nothing. Fail the job here
      # instead so a green p12 run is proof the web-installer pack path actually
      # exercised a real staged AOT runtime.
      - name: require SIGIL_VM_TESTS and a staged runtime (else this job would silently soft-skip)
        shell: pwsh
        run: |
          if ($env:SIGIL_VM_TESTS -ne '1') { Write-Error "p12-update-webinstaller-vm requires SIGIL_VM_TESTS=1; refusing to pass vacuously"; exit 1 }
          $exe = "tests/SigilBuild.Packaging.Tests/bin/Release/net10.0/runtimes/win-x64/SigilBuild.Installer.Host.exe"
          if (-not (Test-Path $exe)) { Write-Error "staged win-x64 installer host runtime missing at $exe; the P12 web-installer pack tests would silently soft-skip having exercised nothing; refusing to pass vacuously"; exit 1 }
          Write-Host "SIGIL_VM_TESTS=1 and staged runtime confirmed present"

      - name: run P12 update-engine end-to-end tests
        shell: pwsh
        run: |
          dotnet test tests/SigilBuild.Wrapper.Tests/SigilBuild.Wrapper.Tests.csproj `
            --configuration Release `
            --no-build `
            --filter "FullyQualifiedName~SigilBuild.Wrapper.Tests.Update" `
            --logger "trx;LogFileName=wrapper-vm-p12-update-tests.trx"

      - name: run P12 web-installer stub end-to-end + pack tests
        shell: pwsh
        run: |
          dotnet test tests/SigilBuild.Packaging.Tests/SigilBuild.Packaging.Tests.csproj `
            --configuration Release `
            --no-build `
            --filter "FullyQualifiedName~WebInstaller" `
            --logger "trx;LogFileName=wrapper-vm-p12-webinstaller-tests.trx"

      - name: upload test results (p12)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-vm-test-results-p12
          path: '**/TestResults/**/*.trx'
          if-no-files-found: warn

  # P11 (T13.1): the live create+reverse legs for the three P11 "system steps"
  # (scheduled_task_create/T11.1, com_register/T11.2, firewall_rule/T11.3),
  # appended as its OWN job per the append-only convention (same rationale as
  # the p12-update-webinstaller-vm job above: kept separate from the install
  # matrix job rather than adding a step to it). P11 shipped with unit/parse/
  # roundtrip tests only (ScheduledTaskCreateStepTests/FirewallRuleStepTests/
  # ComRegisterStepTests in SigilBuild.Wrapper.Tests) — the live legs that need
  # a real elevated schtasks.exe/netsh.exe/HKCR were explicitly deferred to
  # "CI-VM". ScheduledTaskCreateInstallTests / FirewallRuleInstallTests /
  # ComRegisterInstallTests (SigilBuild.Wrapper.IntegrationTests) drive the
  # step classes directly (not through a packed Setup.exe — these steps are
  # machine-scope-only and the point is the step's own schtasks/netsh/COM
  # round trip, not the packaging pipeline), so unlike the main install-matrix
  # job and the p12 job above, this job does NOT need the AOT installer-host
  # runtime staged.
  # Gating: each test soft-skips unless Windows + SIGIL_VM_TESTS=1 +
  # SIGIL_VM_SYSTEMSTEPS=1 + the process is elevated
  # (SigilBuild.Wrapper.Engine.Elevation.IsProcessElevated) — schtasks
  # /RU SYSTEM and netsh advfirewall both require admin. The com_register
  # live register->assert-HKCR-CLSID->unregister leg additionally needs a
  # bundled self-registering test DLL that does not exist yet in this repo;
  # ComRegisterInstallTests.Live_register_then_unregister_a_real_self_registering_dll
  # is an explicit xunit Skip documenting that follow-up (see the T13.1
  # report) rather than a fabricated fixture — it always reports "Skipped",
  # on the VM included, until that DLL is added.
  # NOT locally runnable — this job only executes on windows-latest.
  p11-system-steps-vm:
    runs-on: windows-latest
    name: vm (p11 system steps)
    env:
      SIGIL_VM_TESTS: "1"
      SIGIL_VM_SYSTEMSTEPS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: build integration test project
        run: >
          dotnet build tests/SigilBuild.Wrapper.IntegrationTests/SigilBuild.Wrapper.IntegrationTests.csproj
          --configuration Release

      # HARD GATE (not just a log line): the P11 system-step tests below
      # soft-skip — reporting as Passed, not Skipped — when
      # Elevation.IsProcessElevated() comes back false. That means an
      # unelevated runner would make this whole job go green having
      # exercised nothing, silently. Fail the job here instead so a green
      # p11-system-steps-vm run is proof the live legs actually executed.
      - name: require an elevated runner (else the live legs would silently soft-skip)
        shell: pwsh
        run: |
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "elevated: $isAdmin"
          if (-not $isAdmin) { Write-Error "p11 system-step VM legs require an elevated runner; refusing to pass vacuously"; exit 1 }

      - name: run P11 system-step create+reverse integration tests
        shell: pwsh
        run: |
          dotnet test tests/SigilBuild.Wrapper.IntegrationTests/SigilBuild.Wrapper.IntegrationTests.csproj `
            --configuration Release `
            --no-build `
            --filter "FullyQualifiedName~ScheduledTaskCreateInstallTests|FullyQualifiedName~FirewallRuleInstallTests|FullyQualifiedName~ComRegisterInstallTests" `
            --logger "trx;LogFileName=wrapper-vm-p11-systemsteps-tests.trx"

      - name: upload test results (p11 system steps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-vm-test-results-p11-systemsteps
          path: '**/TestResults/**/*.trx'
          if-no-files-found: warn
