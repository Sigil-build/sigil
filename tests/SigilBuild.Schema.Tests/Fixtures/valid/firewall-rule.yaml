# T11.3 (P11): schema fixture for the machine-scope-only firewall_rule install
# step. scope: machine is required by SIG0310 (SigilBuild.Core.Tests covers that
# diagnostic); this file only proves the JSON Schema shape accepts firewall_rule.
spec: v1.0

app:
  id: com.example.App
  name: App
  version: 0.1.0
  publisher: P

build:
  source: ./out

installer:
  scope: machine

install_steps:
  - id: open_firewall_port
    type: firewall_rule
    name: AcmeAppInbound
    direction: in
    action: allow
    program: "{install_dir}/AcmeApp.exe"
    port: 8443
    protocol: tcp
