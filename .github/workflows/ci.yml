name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    # Sigil's MVP target is Windows-only (NSIS / WiX replacement). MSIX,
    # signtool, the EXE-wrapper runtime, registry steps, COM shortcuts and
    # the brand-aware installer.exe all only make sense on Windows. Linux
    # and macOS legs were dropped on 2026-05-13; revisit only if a real
    # cross-platform packaging story enters scope post-MVP.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: dotnet info
        run: dotnet --info

      - name: restore
        run: dotnet restore Sigil.slnx

      - name: build
        run: dotnet build Sigil.slnx --configuration Release --no-restore

      # T1.2 (R6, CI half): WrapperRuntimeLocator.Locate() / RuntimeStagedFactAttribute
      # resolve the staged host runtime at `runtimes/win-x64/SigilBuild.Installer.Host.exe`
      # relative to AppContext.BaseDirectory -- which, for the packaging test project at
      # `dotnet test` time, is that project's OWN build output directory, not the CLI's.
      # Without staging here, every push runs the ExeWrapper packaging tests against an
      # absent runtime and they report (honestly, post-T1.1) as Skipped instead of Passed.
      # win-x64 ONLY: the tests need no more, and an AOT publish is expensive; aot-publish
      # (below) separately stages win-x64 + win-arm64 for the real shipping artifacts. This
      # duplicates that AOT publish on the critical path of every push -- see T1.2 report
      # for the wall-clock cost trade-off and cheaper alternatives considered.
      - name: stage installer host runtime for tests (win-x64)
        shell: pwsh
        run: |
          ./scripts/publish-installer-runtime.ps1 `
            -Rids win-x64 `
            -Configuration Release `
            -DestinationRoot tests/SigilBuild.Packaging.Tests/bin/Release/net10.0 `
            -SizeGateMb 45

      - name: verify staged win-x64 host runtime for tests
        shell: pwsh
        run: |
          $exe = "tests/SigilBuild.Packaging.Tests/bin/Release/net10.0/runtimes/win-x64/SigilBuild.Installer.Host.exe"
          if (-not (Test-Path $exe)) { throw "staged win-x64 host runtime missing at $exe -- the ExeWrapper packaging tests will silently skip instead of run (R6/R22 failure mode); publish-installer-runtime.ps1 must have failed silently, check its output above" }
          $exeMb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "staged win-x64 SigilBuild.Installer.Host.exe for tests: $exeMb MB"

      - name: test
        run: dotnet test Sigil.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: enforce coverage threshold
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # Coverlet emits one cobertura file per test project. Each file
          # instruments every production assembly the test project transitively
          # references — so the same source line shows up in many reports with
          # different hit counts. Computing a sum or arithmetic average across
          # reports double-counts and skews the result toward 0%. Compute the
          # true union instead: for each unique (assembly, file, line), record
          # max(hits) across all reports, then sum.
          #
          # WBS targets per CLAUDE.md are Core >=80% / Signing+SDK >=85%. The
          # project-wide ratchet (T1.3/R21) is set at the Stage 0 measured
          # baseline rounded down; per-assembly floors below are ratchets too --
          # raise them only when a lane demonstrably raises the measured number,
          # never lower them. Integration-only wrappers (signtool/MakeAppx/Azure/
          # COM) carry [ExcludeFromCodeCoverage].
          import glob, sys, xml.etree.ElementTree as ET
          from collections import defaultdict

          # Floor of floors, retained for continuity/back-compat; PROJECT_WIDE_FLOOR
          # below is the actual enforced gate and is strictly higher than this.
          THRESHOLD = 0.65

          # T1.3/R21 per-assembly floors: set at the CURRENT MEASURED value from
          # Stage 0 rounded DOWN -- a ratchet, not the aspirational CLAUDE.md/
          # AGENTS.md targets (Core >=80%, Signing/SDK >=85%). Project-wide union
          # measured 74.74% at Stage 0.
          PROJECT_WIDE_FLOOR = 0.74
          ASSEMBLY_FLOORS = {
              'SigilBuild.Core': 0.63,
              'SigilBuild.Signing': 0.68,
              'SigilBuild.Wrapper.Core': 0.77,
              'SigilBuild.Packaging': 0.72,
          }

          # All nine shipping assemblies (AGENTS.md repo map). SigilBuild.Cli,
          # SigilBuild.Wrapper and SigilBuild.Installer.Host report ZERO coverage
          # lines today -- nothing in the coverlet-instrumented unit-test tree
          # exercises them directly (only VM/integration suites do).
          #
          # RULING (T1.3, overrides plan text): a MISSING assembly is reported
          # loudly via ::warning:: but does NOT fail the build -- hard-failing here
          # would turn the required `build` check red the moment this lane merges,
          # blocking every Stage 2/3 lane behind it. This tolerance is deliberate
          # and TEMPORARY: move these three into ASSEMBLY_FLOORS (and delete this
          # comment) the day each reports nonzero coverage. Per-assembly floors for
          # assemblies that DO report still hard-fail below -- absence is reported,
          # regression is enforced.
          EXPECTED_ASSEMBLIES = {
              'SigilBuild.Cli',
              'SigilBuild.Core',
              'SigilBuild.Installer.BrandGenerator',
              'SigilBuild.Installer.Host',
              'SigilBuild.Localization.Generator',
              'SigilBuild.Packaging',
              'SigilBuild.Signing',
              'SigilBuild.Wrapper',
              'SigilBuild.Wrapper.Core',
          }

          files = glob.glob('**/TestResults/**/coverage.cobertura.xml', recursive=True)
          if not files:
              print("::error::no coverage.cobertura.xml files found — ensure coverlet is installed")
              sys.exit(1)
          union_hits = defaultdict(int)         # (asm, file, line_num) -> max hits
          asm_keys = defaultdict(set)           # asm -> set of (file, line_num)
          for f in files:
              tree = ET.parse(f)
              for pkg in tree.findall('.//package'):
                  asm = pkg.get('name', '')
                  if not asm.startswith('SigilBuild'):
                      continue
                  for cls in pkg.findall('.//class'):
                      fname = cls.get('filename', '')
                      for line in cls.findall('lines/line'):
                          ln = int(line.get('number', '0'))
                          hits = int(line.get('hits', '0'))
                          key = (asm, fname, ln)
                          if hits > union_hits[key]:
                              union_hits[key] = hits
                          asm_keys[asm].add((fname, ln))
          if not asm_keys:
              print("::error::no SigilBuild.* packages found in coverage reports")
              sys.exit(1)
          print(f"{'assembly':<40} {'covered':>8} {'valid':>8} {'rate':>8} {'floor':>8}")
          total_c = total_v = 0
          failing = []
          for asm, keys in sorted(asm_keys.items()):
              valid = len(keys)
              covered = sum(1 for (f, ln) in keys if union_hits[(asm, f, ln)] > 0)
              total_c += covered
              total_v += valid
              rate = covered / valid if valid else 0
              floor = ASSEMBLY_FLOORS.get(asm)
              floor_str = f"{floor:.0%}" if floor is not None else "n/a"
              print(f"{asm:<40} {covered:>8} {valid:>8} {rate:>8.2%} {floor_str:>8}")
              if floor is not None and rate < floor:
                  failing.append((asm, rate, floor))
          rate = total_c / total_v
          print(f"\nproject-wide union coverage: {total_c}/{total_v} = {rate:.2%} (ratchet floor {PROJECT_WIDE_FLOOR:.0%})")

          missing = sorted(EXPECTED_ASSEMBLIES - set(asm_keys.keys()))
          exit_code = 0
          if missing:
              print(f"::warning::{len(missing)} expected assembly(ies) report ZERO coverage lines: {', '.join(missing)} (TEMPORARILY tolerated -- see comment above, T1.3/R21)")
              for asm in missing:
                  print(f"::warning::missing expected assembly: {asm} (0 lines observed in coverage reports)")

          for asm, a_rate, floor in failing:
              print(f"::error::{asm} coverage {a_rate:.2%} is below its {floor:.0%} floor")
              exit_code = 1

          if rate < PROJECT_WIDE_FLOOR:
              print(f"::error::project-wide union coverage {rate:.2%} is below the {PROJECT_WIDE_FLOOR:.0%} ratchet floor")
              exit_code = 1

          sys.exit(exit_code)
          PY

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'

  aot-publish:
    name: aot publish (win-x64)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: aot publish
        run: dotnet publish src/SigilBuild.Cli -c Release -r win-x64 -p:PublishAot=true -o publish/win-x64

      - name: smoke test
        shell: pwsh
        run: |
          $exe = "publish/win-x64/sigil.exe"
          if (-not (Test-Path $exe)) { throw "binary not produced at $exe" }
          $size = (Get-Item $exe).Length
          $sizeMb = [math]::Round($size / 1MB, 2)
          Write-Host "sigil.exe size: $sizeMb MB"
          if ($size -gt 15MB) { throw "sigil.exe is $sizeMb MB, exceeds 15 MB budget" }
          $output = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "sigil --version exited $LASTEXITCODE" }
          if ($output.Trim() -ne "0.0.1-alpha") { throw "expected '0.0.1-alpha', got '$output'" }

      - name: aot smoke - validate
        shell: pwsh
        run: |
          @"
          spec: v1.0
          app:
            id: com.example.Smoke
            name: Smoke
            version: 0.1.0
            publisher: Smoke Inc.
          build:
            source: ./out
          "@ | Set-Content -Path smoke.yaml -Encoding utf8
          $output = & ./publish/win-x64/sigil.exe validate smoke.yaml
          if ($LASTEXITCODE -ne 0) { throw "validate failed: $output" }

      - name: aot smoke - init
        shell: pwsh
        run: |
          & ./publish/win-x64/sigil.exe init --non-interactive --out gen.yaml `
            --app-id com.example.G --app-name G --version 0.1.0 --publisher G
          if ($LASTEXITCODE -ne 0) { throw "init failed" }
          & ./publish/win-x64/sigil.exe validate gen.yaml
          if ($LASTEXITCODE -ne 0) { throw "validate-of-generated failed" }

      - name: aot smoke - validate examples
        shell: pwsh
        run: |
          $required = @('minimal', 'msix-local-sign', 'azure-trusted-signing', 'full')
          $missing = $required | Where-Object { -not (Test-Path "examples/$_/sigil.yaml") }
          if ($missing.Count -gt 0) { throw "missing example manifests: $($missing -join ', ')" }
          $examples = Get-ChildItem -Path examples -Filter sigil.yaml -Recurse
          foreach ($example in $examples) {
            Write-Host "validating $($example.FullName)"
            & ./publish/win-x64/sigil.exe validate $example.FullName
            if ($LASTEXITCODE -ne 0) { throw "validate failed for $($example.FullName)" }
          }

      # T3 — Native AOT installer host runtime. windows-latest ships the MSVC
      # "Desktop development with C++" workload (win-x64 linker) and the ARM64
      # cross build tools; the publish script adds vswhere to PATH so the AOT
      # link target can find link.exe. The SAME script drives local pack, so
      # CI and `sigil pack` stamp byte-identical runtimes (spec T3).
      - name: aot publish + stage installer host runtimes (win-x64, win-arm64)
        shell: pwsh
        run: |
          ./scripts/publish-installer-runtime.ps1 `
            -Rids win-x64,win-arm64 `
            -Configuration Release `
            -DestinationRoot publish/host-stage `
            -SizeGateMb 45
          # Measured win-x64: exe ~24 MB, full host footprint ~42 MB
          # (Skia+ANGLE+HarfBuzz native libs ~18 MB). Re-pinned 40 -> 45 MB by P9
          # (localization added ~2.26 MB over main's 39.8 MB; InvariantGlobalization
          # intact, no ICU pulled in — see adr-008 §5.2 amendment). ~3 MB headroom.

      - name: verify staged win-x64 host runtime
        shell: pwsh
        run: |
          $exe = "publish/host-stage/runtimes/win-x64/SigilBuild.Installer.Host.exe"
          if (-not (Test-Path $exe)) { throw "staged win-x64 host runtime missing at $exe" }
          $exeMb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "staged win-x64 SigilBuild.Installer.Host.exe: $exeMb MB"

      - name: upload installer host runtime (win-x64)
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-x64
          path: publish/host-stage/runtimes/win-x64/SigilBuild.Installer.Host.exe
          if-no-files-found: error

      # arm64 stages only when the runner provisioned the ARM64 C++ build tools;
      # the publish script tolerates a per-RID failure, so treat a missing arm64
      # artifact as a warning rather than a hard job failure.
      - name: upload installer host runtime (win-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-arm64
          path: publish/host-stage/runtimes/win-arm64/SigilBuild.Installer.Host.exe
          if-no-files-found: warn

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sigil-win-x64
          path: publish/win-x64/sigil.exe
          if-no-files-found: error
