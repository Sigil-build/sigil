name: release

# REL.5 (R7): tag-triggered signed release. Runs the full VM matrix first —
# a release whose install/uninstall matrix did not run is not a release.
on:
  push:
    tags: ['v*']

# Deliberately NO cancel-in-progress: this job signs and publishes a GitHub
# release. Cancelling it mid-run could leave a half-signed or half-uploaded
# release behind, which is far worse than a second tag push just queuing
# behind the first. Same-ref runs (re-pushing the same tag) queue and run
# one at a time instead of pre-empting each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  vm-tests:
    uses: ./.github/workflows/wrapper-vm-tests.yml

  publish:
    runs-on: windows-latest
    needs: vm-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # M1: both refusals run FIRST — before any restore, publish or signing.
      # A release that cannot be signed, or whose tag disagrees with the one
      # version literal, should fail in seconds rather than after two Native
      # AOT publishes and a 45 MB host stage.
      - name: require signing secrets
        shell: pwsh
        env:
          HAS_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' && secrets.TRUSTED_SIGNING_ACCOUNT != '' }}
        run: |
          if ($env:HAS_SIGNING -ne 'true') {
            Write-Error "release refused: Azure Trusted Signing secrets are not configured. An unsigned release is not a release — see docs/plan/release/10-G2_G3_RUNBOOK.md for the six secrets to provision."
            exit 1
          }

      - name: tag matches Directory.Build.props version
        shell: pwsh
        run: |
          # R24 / I5: Directory.Build.props' <Version> is the ONE source of
          # truth. The tag does NOT inject the version (there is no
          # -p:Version= anywhere in this workflow); it must AGREE with the
          # committed value. Bump <Version> in Directory.Build.props, commit,
          # then tag v<Version>.
          $expected = "v" + (Select-Xml -Path "Directory.Build.props" -XPath "//Version").Node.InnerText.Trim()
          $tag = "${{ github.ref_name }}"
          if ($tag -ne $expected) { throw "tag '$tag' does not match Directory.Build.props version '$expected' (R24: one source of truth — bump <Version> in Directory.Build.props before tagging)" }

      - name: restore (locked)
        # R23a / I3: this covers the RID-specific graphs too, because
        # SigilBuild.Cli and SigilBuild.Installer.Host declare
        # <RuntimeIdentifiers>win-x64;win-arm64</RuntimeIdentifiers> and their
        # packages.lock.json files now carry net10.0/win-x64 and
        # net10.0/win-arm64 sections. Both CLI publishes below therefore run
        # --no-restore and cannot silently resolve a package outside the
        # committed lock set.
        run: dotnet restore Sigil.slnx --locked-mode

      - name: aot publish CLI (win-x64)
        run: dotnet publish src/SigilBuild.Cli -c Release -r win-x64 -p:PublishAot=true --no-restore -o publish/win-x64

      # I4: arm64 mirrors ci.yml's tolerance. Whether the runner image carries
      # the "MSVC v143 C++ ARM64 build tools" component is not under our
      # control, and a missing arm64 leg must not sink an otherwise good x64
      # release. Every arm64 step below is gated on this step's outcome; the
      # x64 path stays hard-failing.
      - name: aot publish CLI (win-arm64)
        id: publish-arm64
        continue-on-error: true
        run: dotnet publish src/SigilBuild.Cli -c Release -r win-arm64 -p:PublishAot=true --no-restore -o publish/win-arm64

      - name: warn when the win-arm64 CLI did not publish
        if: steps.publish-arm64.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::warning::win-arm64 CLI publish outcome was '${{ steps.publish-arm64.outcome }}'; this release ships win-x64 assets only. Check whether the runner image still provisions the ARM64 C++ build tools."

      - name: size gate (win-x64)
        shell: pwsh
        run: |
          $size = (Get-Item publish/win-x64/sigil.exe).Length
          $sizeMb = [math]::Round($size / 1MB, 2)
          Write-Host "sigil.exe (win-x64): $sizeMb MB"
          if ($size -gt 15MB) { throw "sigil.exe is $sizeMb MB, exceeds the 15 MB budget" }

      # M2: the arm64 CLI is held to the same 15 MB budget as x64 — an
      # unbudgeted second shipping RID is how a size gate quietly stops
      # meaning anything.
      - name: size gate (win-arm64)
        if: steps.publish-arm64.outcome == 'success'
        shell: pwsh
        run: |
          $size = (Get-Item publish/win-arm64/sigil.exe).Length
          $sizeMb = [math]::Round($size / 1MB, 2)
          Write-Host "sigil.exe (win-arm64): $sizeMb MB"
          if ($size -gt 15MB) { throw "sigil.exe (win-arm64) is $sizeMb MB, exceeds the 15 MB budget" }

      # C1 — the release zips MUST carry the installer-host runtime. `sigil
      # pack --format exe` resolves runtimes/<rid>/SigilBuild.Installer.Host.exe
      # relative to the CLI's own directory (WrapperRuntimeLocator.Locate) and
      # throws FileNotFoundException otherwise, so a CLI-only zip cannot build
      # an exe installer at all. Stage BOTH host RIDs once, outside publish/,
      # then fan the whole runtimes/ tree into each CLI publish directory: a
      # win-x64 sigil must be able to pack arm64 installers and vice versa.
      # This runs before signing (so the host exes and their native deps are
      # signed too) and before the PDB strip / archiving. Same -SizeGateMb 45
      # gate ci.yml uses.
      - name: aot publish + stage installer host runtimes (win-x64, win-arm64)
        shell: pwsh
        run: |
          ./scripts/publish-installer-runtime.ps1 `
            -Rids win-x64,win-arm64 `
            -Configuration Release `
            -DestinationRoot host-stage `
            -SizeGateMb 45

      - name: fan out installer host runtimes into the win-x64 publish
        shell: pwsh
        run: |
          $stage = "host-stage/runtimes"
          if (-not (Test-Path "$stage/win-x64/SigilBuild.Installer.Host.exe")) {
            throw "win-x64 installer host runtime was not staged; the released sigil.exe could not pack an exe installer (C1)."
          }
          Copy-Item -Path $stage -Destination publish/win-x64 -Recurse -Force
          if (-not (Test-Path "publish/win-x64/runtimes/win-x64/SigilBuild.Installer.Host.exe")) {
            throw "runtimes/win-x64/SigilBuild.Installer.Host.exe is missing from publish/win-x64 after the fan-out (C1)."
          }
          if (-not (Test-Path "publish/win-x64/runtimes/win-arm64/SigilBuild.Installer.Host.exe")) {
            Write-Host "::warning::the win-arm64 installer host runtime is absent; the win-x64 sigil in this release cannot pack arm64 exe installers."
          }
          Get-ChildItem publish/win-x64/runtimes -Recurse -File |
            ForEach-Object { Write-Host "  staged $($_.FullName.Substring($PWD.Path.Length + 1))" }

      - name: fan out installer host runtimes into the win-arm64 publish
        if: steps.publish-arm64.outcome == 'success'
        shell: pwsh
        run: |
          $stage = "host-stage/runtimes"
          Copy-Item -Path $stage -Destination publish/win-arm64 -Recurse -Force
          if (-not (Test-Path "publish/win-arm64/runtimes/win-x64/SigilBuild.Installer.Host.exe")) {
            throw "runtimes/win-x64/SigilBuild.Installer.Host.exe is missing from publish/win-arm64 after the fan-out (C1)."
          }
          if (-not (Test-Path "publish/win-arm64/runtimes/win-arm64/SigilBuild.Installer.Host.exe")) {
            Write-Host "::warning::the win-arm64 installer host runtime is absent; the win-arm64 sigil in this release cannot pack arm64 exe installers."
          }

      # M3: files-folder-filter deliberately includes `dll`, which re-signs the
      # vendored native redistributables we ship — libSkiaSharp.dll and
      # libsodium.dll beside sigil.exe, plus the Skia/ANGLE/HarfBuzz set under
      # runtimes/<rid>/native/. That is intentional: everything Sigil
      # redistributes carries Sigil's Authenticode signature, so a user's
      # SmartScreen / WDAC evaluation sees ONE publisher for the whole zip
      # instead of a mix of signed and unsigned third-party DLLs. Re-signing a
      # redistributable asserts "we vouch for these exact bits", not authorship
      # — upstream attribution stays in THIRD-PARTY-NOTICES.md, which ships in
      # the same archive.
      - name: sign binaries (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          # v2.0.0's name for this input; the old
          # `trusted-signing-account-name` is accepted but deprecated.
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/publish
          files-folder-filter: exe,dll
          files-folder-recurse: true

      - name: package archive (win-x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem publish/win-x64 -Filter *.pdb -Recurse -File | Remove-Item -Force
          Copy-Item THIRD-PARTY-NOTICES.md publish/win-x64/
          Compress-Archive -Path publish/win-x64/* -DestinationPath "dist/sigil-${{ github.ref_name }}-win-x64.zip"

      - name: package archive (win-arm64)
        if: steps.publish-arm64.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem publish/win-arm64 -Filter *.pdb -Recurse -File | Remove-Item -Force
          Copy-Item THIRD-PARTY-NOTICES.md publish/win-arm64/
          Compress-Archive -Path publish/win-arm64/* -DestinationPath "dist/sigil-${{ github.ref_name }}-win-arm64.zip"

      # R42 / SUP.3 (applied by PR #42, commit 81584de): the SBOM
      # must describe exactly what got signed and released, so it runs after
      # signing + packaging (dist/ already exists by this point, created by
      # the win-x64 archive step above) and before SHA256SUMS / the release
      # asset upload, so the SBOM itself gets checksummed and attached like
      # every other dist/* asset. No continue-on-error: an SBOM that silently
      # failed to generate is a release-integrity gap, not a warning.
      - name: install CycloneDX SBOM tool
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          # `dotnet tool install --global` updates the user PATH via the
          # registry, which a *new* shell picks up -- not necessarily this
          # job's remaining steps. Append explicitly via GITHUB_PATH rather
          # than assume the runner image already carries ~/.dotnet/tools.
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: generate CycloneDX SBOM
        shell: pwsh
        run: |
          # The handoff doc's `--json` flag does not exist on this tool's
          # actual CLI (checked against CycloneDX/cyclonedx-dotnet's --help
          # at pin time): the real flag is `-F/--output-format`. `-fn`'s
          # .json extension would already select JSON under the default
          # Auto format, but `-F Json` is explicit and doesn't rely on that
          # inference.
          #
          # -dpr/--disable-package-restore: the "restore (locked)" step above
          # already ran `dotnet restore Sigil.slnx --locked-mode` (R23a). By
          # default CycloneDX does its own internal restore, which is NOT
          # locked and would silently re-resolve the graph the SBOM describes
          # outside that guarantee. Skip it and reuse the locked restore.
          $sbom = "dist/sigil-${{ github.ref_name }}.sbom.json"
          dotnet CycloneDX Sigil.slnx -o dist -fn "sigil-${{ github.ref_name }}.sbom.json" -F Json -dpr
          if (-not (Test-Path $sbom)) { throw "SBOM not generated at $sbom" }
          Write-Host "generated $sbom"

      - name: SHA256SUMS
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Path dist/SHA256SUMS -Encoding ascii

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # I2: PowerShell does NOT glob arguments for native executables, so
          # the previous literal `dist/*` reached gh as the string "dist/*" and
          # uploaded nothing at all. Expand the list here and splat it.
          $assets = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          if (@($assets).Count -lt 1) { throw "no release assets found in dist/" }
          Write-Host "uploading $(@($assets).Count) asset(s):"
          $assets | ForEach-Object { Write-Host "  $_" }
          gh release create "${{ github.ref_name }}" `
            --title "sigil ${{ github.ref_name }}" `
            --notes-file CHANGELOG.md `
            --prerelease `
            @assets
          if ($LASTEXITCODE -ne 0) { throw "gh release create exited $LASTEXITCODE" }
