spec: v1.0

app:
  id: com.example.hellowixkiller
  name: HelloWiXKiller
  version: 1.0.0
  publisher: SigilBuild

build:
  source: ./payload

package:
  formats: [exe]
  architectures: [x64]

# The destination is deliberately NOT a parameter. `{install_dir}` is the
# installer's own resolved destination: it defaults to `<scope root>\<app name>`,
# the wizard's Destination screen writes to it, `/D=` overrides it, and an upgrade
# reuses the prior location. A `parameters.install_dir` would be a second,
# unrelated value that diverges from all four the moment the user picks anywhere
# else — and `%ProgramFiles%` in a parameter default is never expanded (step paths
# get no environment-variable expansion), so it would resolve relative to the
# working directory and be refused for landing outside install_dir.
parameters:
  registered_user:
    type: string
    default: "Default User"
    install_time: true

install_steps:
  - id: copy-app
    type: file_copy
    from: payload/**
    to: "{install_dir}"
  - id: reg-displayname
    type: registry_write
    hive: HKCU
    key: "Software\\HelloWiXKiller"
    name: DisplayName
    type_value: REG_SZ
    value: HelloWiXKiller
  - id: reg-version
    type: registry_write
    hive: HKCU
    key: "Software\\HelloWiXKiller"
    name: Version
    type_value: REG_SZ
    value: "1.0.0"
  - id: reg-installdir
    type: registry_write
    hive: HKCU
    key: "Software\\HelloWiXKiller"
    name: InstallDir
    # REG_SZ, not REG_EXPAND_SZ: {install_dir} resolves to a literal absolute
    # path, so there is nothing left for the registry to expand.
    type_value: REG_SZ
    value: "{install_dir}"
  - id: reg-user
    type: registry_write
    hive: HKCU
    key: "Software\\HelloWiXKiller"
    name: RegisteredUser
    type_value: REG_SZ
    value: ${parameters.registered_user}
  # `start_menu` and `desktop` are named anchors that resolve to the SCOPE-CORRECT
  # shell folder — the all-users folders for a machine install, the current user's
  # for a per-user one. Writing a folder called "StartMenu" inside the install
  # directory, as this example used to, puts no entry in anyone's Start Menu.
  - id: shortcut-startmenu
    type: shortcut_create
    target: "{install_dir}\\app.exe"
    location: start_menu
    name: HelloWiXKiller
    description: "Launch HelloWiXKiller"
  - id: shortcut-desktop
    type: shortcut_create
    target: "{install_dir}\\app.exe"
    location: desktop
    name: HelloWiXKiller-Desktop
    description: "Launch HelloWiXKiller"

post_install:
  - id: post-mark-installed
    type: registry_write
    hive: HKCU
    key: "Software\\HelloWiXKiller"
    name: PostInstallCompleted
    type_value: REG_DWORD
    value: 1
